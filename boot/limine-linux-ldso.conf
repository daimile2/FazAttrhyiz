# Opt-in bounded real ld.so; product defaults stay off.
# For installed disks use limine-linux-ldso-disk.conf.
timeout: 0

/CapMix experimental Linux ldso product
    protocol: limine
    kernel_path: boot():/boot/capmix.elf
    cmdline: capmix.mode=product capmix.console=serial capmix.linux=1 capmix.linux_interp=1
