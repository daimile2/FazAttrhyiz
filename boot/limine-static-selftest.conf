# Limine config for CapMix. Place next to the kernel on the ESP / ISO.
timeout: 0

/CapMix selftest
    protocol: limine
    kernel_path: boot():/boot/capmix.elf
    # Serial remains available; kernel also uses Limine framebuffer when present.
    cmdline: capmix.mode=selftest capmix.console=serial capmix.net=static
