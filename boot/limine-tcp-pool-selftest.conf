# TCP pool and hardware network regression; Linux persona explicitly disabled.
timeout: 0

/CapMix TCP pool selftest
    protocol: limine
    kernel_path: boot():/boot/capmix.elf
    cmdline: capmix.mode=selftest capmix.console=serial capmix.udp_echo=1 capmix.tcp_echo=1 capmix.tcp_drop=1 capmix.linux=0
