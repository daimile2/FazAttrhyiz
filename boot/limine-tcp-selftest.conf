# Limine config for FazAttrhyiz. Place next to the kernel on the ESP / ISO.
timeout: 0

/FazAttrhyiz selftest
    protocol: limine
    kernel_path: boot():/boot/capmix.elf
    # Serial remains available; kernel also uses Limine framebuffer when present.
    cmdline: capmix.mode=selftest capmix.console=serial capmix.udp_echo=1 capmix.tcp_echo=1
