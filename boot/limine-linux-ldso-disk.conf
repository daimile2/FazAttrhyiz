# Disk-only opt-in real ld.so; installed=1 retains existing package validation.
# install-disk.py --config this file, without --linux (it resets interp=0).
timeout: 0

/CapMix experimental Linux ldso product
    protocol: limine
    kernel_path: boot():/boot/capmix.elf
    cmdline: capmix.mode=product capmix.console=serial capmix.installed=1 capmix.linux=1 capmix.linux_interp=1
